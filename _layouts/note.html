<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} | {% endif %}Notes | Meghanath Macha</title>
    <meta name="description" content="{{ page.description | default: 'Short takes by Meghanath Macha, mostly on building AI systems.' }}">
    <meta name="author" content="Meghanath Macha">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <meta property="og:type" content="{% if page.date %}article{% else %}website{% endif %}">
    <meta property="og:title" content="{{ page.title | default: 'Notes' }}">
    <meta property="og:description" content="{{ page.description | default: 'Short takes by Meghanath Macha, mostly on building AI systems.' }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta name="twitter:card" content="summary">
    <link rel="icon" href="/favicon.ico">
    <link rel="alternate" type="application/rss+xml" title="Notes by Meghanath Macha" href="/notes/feed.xml">
    <script>
        (function() {
            var t = localStorage.getItem('theme');
            if (t === 'dark' || (t !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #ffffff;
            --fg: #1a202c;
            --muted: #5b6878;
            --rule: #e2e8f0;
            --link: #2b6cb0;
        }
        html.dark {
            --bg: #121212;
            --fg: #e2e8f0;
            --muted: #a0aec0;
            --rule: #2d3748;
            --link: #90cdf4;
        }
        * { box-sizing: border-box; }
        html { background: var(--bg); }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--fg);
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 18px;
            line-height: 1.65;
            -webkit-font-smoothing: antialiased;
        }
        .wrap {
            max-width: 680px;
            margin: 0 auto;
            padding: 32px 20px 80px;
        }
        header.site {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding-bottom: 20px;
            margin-bottom: 40px;
            border-bottom: 1px solid var(--rule);
            font-size: 15px;
        }
        header.site a { color: var(--fg); text-decoration: none; }
        header.site .name { font-weight: 700; }
        header.site nav a { color: var(--muted); margin-left: 20px; }
        header.site nav a:hover, header.site .name:hover { color: var(--link); }
        a { color: var(--link); text-decoration: none; }
        a:hover { text-decoration: underline; }
        a:focus-visible, button:focus-visible {
            outline: 2px solid var(--link);
            outline-offset: 3px;
            border-radius: 2px;
        }
        ::selection { background: var(--link); color: var(--bg); }
        h1 {
            font-size: 30px;
            line-height: 1.2;
            font-weight: 700;
            margin: 0 0 6px;
            letter-spacing: -0.01em;
            text-wrap: balance;
        }
        .meta { color: var(--muted); font-size: 15px; margin-bottom: 36px; }
        article p { margin: 0 0 1.25em; text-wrap: pretty; }
        article h2 { font-size: 20px; margin: 2em 0 0.6em; }
        article blockquote {
            margin: 1.5em 0;
            padding-left: 18px;
            border-left: 2px solid var(--rule);
            color: var(--muted);
        }
        article code {
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 0.9em;
            background: var(--rule);
            padding: 1px 5px;
            border-radius: 3px;
        }
        article pre {
            background: var(--rule);
            padding: 14px 16px;
            overflow-x: auto;
            border-radius: 4px;
        }
        article pre code { background: none; padding: 0; }
        article img { max-width: 100%; height: auto; }
        article hr { border: 0; border-top: 1px solid var(--rule); margin: 2em 0; }
        .intro { color: var(--muted); margin: 0 0 36px; }
        ul.posts { list-style: none; padding: 0; margin: 0; }
        ul.posts li {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            padding: 12px 0;
            border-bottom: 1px solid var(--rule);
        }
        ul.posts li a { color: var(--fg); }
        ul.posts li a:hover { color: var(--link); }
        ul.posts time { color: var(--muted); font-size: 15px; white-space: nowrap; }
        footer.site {
            margin-top: 56px;
            padding-top: 20px;
            border-top: 1px solid var(--rule);
            color: var(--muted);
            font-size: 14px;
        }
        footer.site p { margin: 0 0 6px; }
        @media (max-width: 480px) {
            body { font-size: 17px; }
            h1 { font-size: 26px; }
            ul.posts li { flex-direction: column; gap: 2px; }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <header class="site">
            <a class="name" href="/">Meghanath Macha</a>
            <nav>
                <a href="/notes/">Notes</a>
                <a href="/#bio">About</a>
                <a href="/#contact">Contact</a>
            </nav>
        </header>
        <main>
            {{ content }}
        </main>
        <footer class="site">
            <p>Opinions mine, not my employer's.</p>
            <p><a href="/notes/feed.xml">RSS</a></p>
        </footer>
    </div>
</body>
</html>
